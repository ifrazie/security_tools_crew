[project]
name = "security_tools_crew"
version = "0.1.0"
description = "security_tools_crew using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.13"
dependencies = [
    "crewai[tools]>=0.108.0,<1.0.0",
    "python-nmap>=0.7.1",
]

[project.scripts]
security_tools_crew = "security_tools_crew.main:run"
run_crew = "security_tools_crew.main:run"
train = "security_tools_crew.main:train"
replay = "security_tools_crew.main:replay"
test = "security_tools_crew.main:test"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"
